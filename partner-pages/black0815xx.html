        /* From Uiverse.io by mahiatlinux */ 
ul {
  list-style: none;
}

.example-1 {
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bolder; /* Made bolder */
  background-color: #333; /* Black background */
  border-radius: 30px; /* Added border-radius to make the container rounded */
  padding: 20px; /* Added padding for better appearance */
  height: 70px;
  width: 300px auto;
}

.example-1 .icon-content {
  margin: 0 10px;
  position: relative;
  font-weight: bolder; /* Made bolder */
}
/* Active State für Social Icons */
.example-1 .icon-content .link.active {
  background-color: #fff; /* Weißer Hintergrund */
  color: #000; /* Schwarzes Icon */
  transform: scale(1.2); /* Optional: leicht vergrößern */
  transition: all 0.3s ease-in-out;
}


.example-1 .icon-content .tooltip {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #fff; /* White background */
  color: #000; /* Black text */
  padding: 6px 10px;
  border-radius: 5px;
  opacity: 0;
  visibility: hidden;
  font-size: 14px;
  transition: all 0.3s ease;
  font-weight: bolder; /* Made bolder */
}

.example-1 .icon-content:hover .tooltip {
  opacity: 1;
  visibility: visible;
  top: -50px;
}

.example-1 .icon-content .link {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  color: #fff; /* White icons */
  background-color: #000; /* Black background */
  transition: all 0.3s ease-in-out;
  font-weight: bolder; /* Made bolder */
}

.example-1 .icon-content .link:hover {
  box-shadow: 3px 2px 45px 0px rgb(0 0 0 / 12%);
}

.example-1 .icon-content .link svg {
  width: 60%;
  height: auto; /* <- behält Seitenverhältnis */
  max-height: 60%; /* damit es nicht zu groß wird */
  fill: #fff;
}


.example-1 .link[data-social="youtube"]:hover {
  color: #ff0000;
}

.example-1 .link[data-social="twitch"]:hover {
  color: #9146ff;
}

.example-1 .link[data-social="discord"]:hover {
  color: #5865f2;
}

   <script>// window.location.href = "https://youtu.be/ueNY30Cs8Lk?si=JsPQ_whORWTuYGJj";
     fetch('src/JSON/Projects/settings.json')
  .then(response => {
    if (!response.ok) throw new Error("Datei konnte nicht geladen werden.");
    return response.json();
  })
  .then(data => {
    // Quarantänemodus prüfen
    if (data.quarantine === true) {
      window.location.href = 'error.html?reason=503';
      return;
    }

    // Dateinamen der aktuellen Seite ermitteln
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';

    // Wartungsmodus prüfen
    if (data.maintenance && typeof data.maintenance === 'object') {
      if (data.maintenance[currentPage] === true) {
        window.location.href = 'error.html?reason=maintenance';
      }
    }
  })
  .catch(error => {
    console.error('Fehler beim Laden der JSON-Datei:', error);
  });

     </script>
