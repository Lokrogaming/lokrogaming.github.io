    /* Card Style */
    .card {
      position: relative;
      width: 190px;
      height: 254px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: end;
      padding: 12px;
      gap: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin: 15px auto;
      text-align: center;
      color: white;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      left: -5px;
      margin: auto;
      width: 200px;
      height: 264px;
      border-radius: 10px;
      background: linear-gradient(-45deg, #e81cff 0%, #40c9ff 100%);
      z-index: -10;
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card::after {
      content: "";
      z-index: -1;
      position: absolute;
      inset: 0;
      background: linear-gradient(-45deg, #fc00ff 0%, #00dbde 100%);
      transform: translate3d(0, 0, 0) scale(0.95);
      filter: blur(20px);
    }

    .heading {
      font-size: 20px;
      text-transform: capitalize;
      font-weight: 700;
    }

    .card p:not(.heading) {
      font-size: 14px;
    }

    .card p:last-child {
      color: #e81cff;
      font-weight: 600;
    }

    .card:hover::after {
      filter: blur(30px);
    }

    .card:hover::before {
      transform: rotate(-90deg) scaleX(1.34) scaleY(0.77);
    }
  </style>
</head>

    <h1>Couldn't find your search request!</h1>

 <input id="searchbar" type="text" placeholder="Type in search" width="50%">
 <br><br>
 <p id="txt" style="text-align:center;">Looks like nothing is there...</p>
 <div id="results"></div><br><br><br>
 <button class="btn btn-danger" onclick="back()">< Go back</button>

  <script>
    document.getElementById("searchbar").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        updateSearch();
      }
    });

    const suchDaten = {
      "discord": "https://dcs.lol/lokrogaming",
      "games": "https://lokrogaming.github.io/game-library.html",
      "about": "https://lokrogaming.github.io/about.html",
      "reufnr": "https://lokrogaming.github.io/reufnr",
      "black0815xx": "https://lokrogaming.github.io/black0815xx",
      "cookieclicker": "https://lokrogaming.github.io/cc/",
      "partner": "https://lokrogaming.github.io/partner.html",
      "portfoleez": "https://lokrogaming.github.io/portfoleez",
      "nodea": "https://lokrogaming.github.io/nodea",
      "twitch": "https://twitch.tv/lokrogamer",
      "tiktok": "https://tiktok.me/lokrogaming"
    };

    function treffQuote(query, key) {
      let match = 0;
      const minLen = Math.min(query.length, key.length);
      for (let i = 0; i < minLen; i++) {
        if (query[i] === key[i]) match++;
      }
      return Math.round((match / key.length) * 100);
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const request = params.get("request");

      if (request) {
        const searchrequest = decodeURIComponent(request).toLowerCase();
        document.getElementById("txt").innerHTML = `<i class="bi bi-search"></i> &nbsp;&nbsp;&nbsp;Suchbegriff: ${searchrequest}`;
        
        const resultContainer = document.getElementById("results");
        resultContainer.innerHTML = "";
        let foundAny = false;

        Object.entries(suchDaten).forEach(([key, value]) => {
          if (key.includes(searchrequest)) {
            foundAny = true;
            const quote = treffQuote(searchrequest, key);
            const item = document.createElement("div");
            item.className = "result-item";
            item.innerHTML = `
              <div class="card" onclick="window.open('${value}', '_blank')">
                <p class="heading">${key}</p>
                <p>Trefferquote: ${quote}%</p>
                <p>Klicke hier, um zu öffnen</p>
              </div>
            `;
            resultContainer.appendChild(item);
          }
        });

        if (!foundAny) {
          document.getElementById("error").style.display = "block";
        }
      } else {
        document.getElementById("txt").innerText = "No search request provided.";
        document.getElementById("error").style.display = "block";
        setTimeout(back, 3000);
      }
    };

    function back() {
      history.back();
    }

    function updateSearch() {
      let searchbarInput = document.getElementById("searchbar").value;
      if (searchbarInput) {
        window.location.href=`?request=${searchbarInput}`
      } else {
        alert("Search can't be empty!");
      }
    }
  </script>
