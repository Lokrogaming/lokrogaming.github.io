<!DOCTYPE html>

  <style>
    body {
      background-image: 
    linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),

  content: "";

}

    button.mc {
      font-size: 18px;
      background-color: #008542;
      color: #fff;
      text-shadow: 0 2px 0 rgb(0 0 0 / 25%);
      display: inline-flex;
      align-items: center;

      position: relative;
      border: 0;
      z-index: 1;
      user-select: none;

      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: unset;
      padding: 0.8rem 1.5rem;
      text-decoration: none;
      font-weight: 900;
      transition: all 0.7s cubic-bezier(0, 0.8, 0.26, 0.99);
      margin: 0.5rem;
    }
    button.mc:before {
      position: absolute;
      pointer-events: none;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      transition: 0.7s cubic-bezier(0, 0.8, 0.26, 0.99);
      z-index: -1;
      background-color: #008542 !important;
      box-shadow: 0 -4px rgb(21 108 0 / 50%) inset,
        0 4px rgb(100 253 31 / 99%) inset, -4px 0 rgb(100 253 31 / 50%) inset,
        4px 0 rgb(21 108 0 / 50%) inset;
    }
    button.mc:after {
      position: absolute;
      pointer-events: none;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      content: "";
      box-shadow: 0 4px 0 0 rgb(0 0 0 / 15%);
      transition: 0.7s cubic-bezier(0, 0.8, 0.26, 0.99);
    }
    button.mc:hover:before {
      box-shadow: 0 -4px rgb(0 0 0 / 50%) inset, 0 4px rgb(255 255 255 / 20%) inset,
        -4px 0 rgb(255 255 255 / 20%) inset, 4px 0 rgb(0 0 0 / 50%) inset;
    }
    button.mc:hover:after {
      box-shadow: 0 4px 0 0 rgb(0 0 0 / 15%);
    }
    button.mc:active {
      transform: translateY(4px);
    }
    button.mc:active:after {
      box-shadow: 0 0px 0 0 rgb(0 0 0 / 15%);
    }

.server-board {
      background: #1c1f26;
      border-radius: 10px;
      padding: 1.5rem 2rem;
      width: auto;
      max-width: 90vw;
      color: white;
      position: relative;
      box-shadow: 0 0 20px #008542;
      font-family: 'Minecraftia', monospace;
      align-items: center;
      display: flex;
      flex-direction: column;
    }
    .server-card {background: #1c1f26;border: 2px solid #333;border-radius: 8px;width: 600px;padding: 16px;margin-bottom: 20px;display: flex;flex-direction: row;align-items: flex-start;gap: 15px;position: relative;}
    .server-icon {
      width: 64px;
      height: 64px;
      background: #000;
      border: 1px solid #333;
      object-fit: contain;
    }
    .server-info {
      flex-grow: 1;
    }
    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .server-name {
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
    }
    .status-online {
      color: #55FF55;
    }
    .status-offline {
      color: #FF5555;
      font-family: 'Minecraftia', monospace;
    }
    .motd {
      margin: 8px 0;
      line-height: 1.2;
      white-space: pre-wrap;
    }
    .server-footer {
      font-size: 0.8rem;
      color: #aaa;
      display: none;
      margin-top: 4px;
    }
    .server-name:hover + .server-footer,
    .server-footer.show {
      display: block;
    }
    /* Edit button on card */
    .edit-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: invert(1);
      transition: filter 0.3s;
    }
    .edit-btn:hover {
      filter: invert(0.5) brightness(1.5);
    }
    .edit-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    /* Overlay modal */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .overlay.show {
      visibility: visible;
      opacity: 1;
    }
    .modal {
      background: #1c1f26;
      border-radius: 10px;
      padding: 1.5rem 2rem;
      width: 400px;
      max-width: 90vw;
      color: white;
      position: relative;
      box-shadow: 0 0 20px #008542;
      font-family: 'Minecraftia', monospace;
    }
    .modal h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-weight: 900;
    }
    .modal label {
      display: block;
      margin-bottom: 0.5rem;
      margin-top: 1rem;
    }
    .modal input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: #0b0d11;
      color: white;
      font-family: 'Minecraftia', monospace;
      font-size: 1rem;
    }
    .modal input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 0.5rem;
      cursor: pointer;
    }
    .modal-buttons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
    .modal .button {
      background-color: #008542;
      border: none;
      padding: 0.5rem 1.25rem;
      font-weight: 900;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .modal button:hover {
      background-color: #00662e;
    }
    .modal .delete-btn {
      background-color: #cc3333;
    }
    .modal .delete-btn:hover {
      background-color: #990000;
    }
    .modal .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #aaa;
      cursor: pointer;
      transition: color 0.3s;
    }
    .modal .close-btn:hover {
      color: white;
    }

<body>
<img class="bg" src="https://tse3.mm.bing.net/th/id/OIP.oQVA_GwCK2ibSksoiKd1mQHaHa?r=0&cb=ucfimgc2&rs=1&pid=ImgDetMain&o=7&rm=3" alt="BG">
<div class="server-board">
<h1>Minecraft Serverliste</h1>

<div id="server-list"></div>


<button class="mc" id="addServerBtn">Server vorschlagen</button>
</div>
<!-- Overlay Modal -->
<div id="serverModal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
  <div class="modal">
    <button class="close-btn" title="Schließen">&times;</button>
    <h2 id="modalTitle">Server hinzufügen</h2>
    <form id="serverForm">
      <label for="serverAddress">Server Adresse:</label>
      <input type="text" id="serverAddress" name="serverAddress" placeholder="play.example.net" required />
      <label>
        <input type="checkbox" id="rememberCheckbox" name="remember" checked />
        Server dauerhaft speichern
      </label>
      <div class="modal-buttons">
        <button class="mc" type="submit" id="saveBtn">Speichern</button>
        <button type="button" id="deleteBtn" class="delete" style="display:none;">Löschen</button>
      </div>
    </form>
  </div>
</div>

<script>
  const fallbackIcon = "https://orig00.deviantart.net/26db/f/2015/326/4/f/minecraft_grass_block_by_flutterspon-d9hlkmq.jpg";

  // Keys für Storage
  const LS_KEY = 'customServers';
  const BLOCK_KEY = 'blockedServers';

  // Voreingestellte Server
  const defaultServers = [
    { address: 'play.hypixel.net', isDefault: true },
    { address: 'primeblocks.net', isDefault: true },
    { address: 'madgames.fmh.best', isDefault: true, tag: "featured" },
    { address: 'lg-smp.feathermc.gg', isDefault: true, tag: "featured", isRecommended: true }
  ];

  // Feste Blockliste (vom Code aus)
  const blockedServersDefault = [
    "-",
    "yukicraft.net",
    "-"
  ];

  // Elemente
  const container = document.getElementById('server-list');
  const addServerBtn = document.getElementById('addServerBtn');
  const serverModal = document.getElementById('serverModal');
  const modalTitle = serverModal.querySelector('h2');
  const serverForm = document.getElementById('serverForm');
  const serverAddressInput = document.getElementById('serverAddress');
  const rememberCheckbox = document.getElementById('rememberCheckbox');
  const saveBtn = document.getElementById('saveBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const closeBtn = serverModal.querySelector('.close-btn');

  // Server-Daten
  let customServers = loadCustomServers();
  let blockedServers = loadBlockedServers();
  let allServers = [...defaultServers, ...customServers];

  // Aktuell bearbeiteter Server-Index
  let editingIndex = null;

  // === Blockierte Server laden/speichern ===
  function loadBlockedServers() {
    const data = localStorage.getItem(BLOCK_KEY);
    let stored = [];
    try {
      stored = data ? JSON.parse(data) : [];
    } catch {
      stored = [];
    }
    // feste + gespeicherte kombinieren
    return [...new Set([...blockedServersDefault, ...stored])];
  }

  function saveBlockedServers(servers) {
    localStorage.setItem(BLOCK_KEY, JSON.stringify(servers));
    blockedServers = loadBlockedServers(); // neu laden
  }

  // === Custom-Server laden/speichern ===
  function loadCustomServers() {
    const local = localStorage.getItem(LS_KEY);
    const session = sessionStorage.getItem(LS_KEY);
    try {
      if(local) return JSON.parse(local);
      if(session) return JSON.parse(session);
    } catch {
      return [];
    }
    return [];
  }

  function saveCustomServers(servers, remember) {
    if(remember) {
      localStorage.setItem(LS_KEY, JSON.stringify(servers));
      sessionStorage.removeItem(LS_KEY);
    } else {
      sessionStorage.setItem(LS_KEY, JSON.stringify(servers));
      localStorage.removeItem(LS_KEY);
    }
  }

  // === Serverliste rendern ===
  function renderServerList() {
    container.innerHTML = '';
    allServers.forEach((server, index) => {
      const { address, isDefault, tag, isRecommended} = server;

      // Blockierte Server überspringen
      if (blockedServers.includes(address)) {
        return;
      }

      const card = document.createElement('div');
      card.className = 'server-card';

      // --- Tag-Container ---
      const tagContainer = document.createElement('div');
      tagContainer.className = 'tag-container';

      if(server.tag === 'featured') {
        const crown = document.createElement('div');
        crown.className = 'crown';
        crown.textContent = '👑';
        tagContainer.appendChild(crown);
      }
      if(isRecommended) {
        const recommended = document.createElement('div');
        recommended.className = 'recommended';
        recommended.textContent = '✈️';
        tagContainer.appendChild(recommended);
      }
      if(tagContainer.childNodes.length > 0) {
        card.appendChild(tagContainer);
      }

      const icon = document.createElement('img');
      icon.className = 'server-icon';
      icon.src = fallbackIcon;
      icon.alt = "Server Icon";
      card.appendChild(icon);

      const info = document.createElement('div');
      info.className = 'server-info';
      info.innerHTML = `
        <div class="server-header">
          <div class="server-name">Lade...</div>
          <div class="player-count"></div>
        </div>
        <div class="motd"></div>
        <div class="server-footer"></div>
      `;
      card.appendChild(info);

      const nameEl = info.querySelector('.server-name');
      const playerEl = info.querySelector('.player-count');
      const motdEl = info.querySelector('.motd');
      const footerEl = info.querySelector('.server-footer');

      // Edit & Block-Buttons
      if(!isDefault) {
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.title = 'Server bearbeiten';
        editBtn.innerHTML = `
          <svg class="edit-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15.4998 5.50067L18.3282 8.3291M13 21H21M3 21.0004L3.04745 20.6683C3.21536 19.4929 3.29932 18.9052 3.49029 18.3565C3.65975 17.8697 3.89124 17.4067 4.17906 16.979C4.50341 16.497 4.92319 16.0772 5.76274 15.2377L17.4107 3.58969C18.1918 2.80865 19.4581 2.80864 20.2392 3.58969C21.0202 4.37074 21.0202 5.63707 20.2392 6.41812L8.37744 18.2798C7.61579 19.0415 7.23497 19.4223 6.8012 19.7252C6.41618 19.994 6.00093 20.2167 5.56398 20.3887C5.07171 20.5824 4.54375 20.6889 3.48793 20.902L3 21.0004Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
        card.appendChild(editBtn);

        editBtn.addEventListener('click', e => {
          e.stopPropagation();
          openModal('edit', index);
        });

       

        
      }

      container.appendChild(card);

      // Serverdaten laden
      fetch(`https://api.mcsrvstat.us/3/${address}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.online && data.icon) {
            icon.src = data.icon;
          } else {
            icon.src = fallbackIcon;
          }
          icon.onerror = () => {
            icon.src = fallbackIcon;
          };

          if (data && data.online) {
            nameEl.innerHTML = `<span class="status-online">✔</span> ${address}`;
          } else {
            nameEl.innerHTML = `<span class="status-offline">✖ Offline</span> ${address}`;
          }

          if (data && data.online && data.ip && data.port) {
            const resolvedIp = `${data.ip}:${data.port}`;
            const resolvedSpan = document.createElement("div");
            resolvedSpan.textContent = resolvedIp;
            resolvedSpan.style.display = "none";
            resolvedSpan.style.fontSize = "0.8rem";
            resolvedSpan.style.color = "#999";
            resolvedSpan.style.marginTop = "4px";
            nameEl.appendChild(resolvedSpan);

            nameEl.style.cursor = "pointer";
            nameEl.addEventListener("click", () => {
              resolvedSpan.style.display = resolvedSpan.style.display === "none" ? "block" : "none";
            });
          }

          if (data && data.online && data.players) {
            playerEl.textContent = `Spieler: ${data.players.online}/${data.players.max}`;
          } else {
            playerEl.textContent = '';
          }

          const motdLines = data?.motd?.html || ['Keine MOTD'];
          motdEl.innerHTML = motdLines.join('<br>');

          const version = data?.version || '?';
          const hostname = data?.hostname || address;
          const port = data?.port || '';
          footerEl.innerHTML = `Version: ${version} | IP: ${hostname}${port ? ':' + port : ''}`;

          nameEl.addEventListener("click", () => {
            footerEl.classList.toggle("show");
          });
        })
        .catch(err => {
          nameEl.innerHTML = `<span class="status-offline">✖ Fehler beim Laden</span> ${address}`;
          icon.src = fallbackIcon;
          playerEl.textContent = '';
          motdEl.textContent = '';
          footerEl.textContent = '';
          console.error(err);
        });
    });
  }

  // Modal öffnen
  function openModal(mode, index = null) {
    editingIndex = index;
    serverForm.reset();
    deleteBtn.style.display = 'none';

    if (mode === 'add') {
      modalTitle.textContent = 'Server hinzufügen';
      saveBtn.textContent = 'Speichern';
      rememberCheckbox.checked = true;
      serverAddressInput.value = '';
    } else if (mode === 'edit') {
      modalTitle.textContent = 'Server bearbeiten';
      saveBtn.textContent = 'Speichern';
      deleteBtn.style.display = 'inline-block';
      if (index !== null) {
        serverAddressInput.value = allServers[index].address;
        rememberCheckbox.checked = isServerRemembered(allServers[index].address);
      }
    }
    serverModal.classList.add('show');
    serverAddressInput.focus();
  }

  function closeModal() {
    serverModal.classList.remove('show');
    editingIndex = null;
  }

  closeBtn.addEventListener('click', closeModal);
  serverModal.addEventListener('click', e => {
    if (e.target === serverModal) closeModal();
  });

  // Prüfen, ob Server remembered ist
  function isServerRemembered(address) {
    const local = localStorage.getItem(LS_KEY);
    if(!local) return false;
    try {
      const servers = JSON.parse(local);
      return servers.some(s => s.address === address);
    } catch {
      return false;
    }
  }

  // === Form Submit ===
  serverForm.addEventListener('submit', e => {
    e.preventDefault();
    const address = serverAddressInput.value.trim();
    if(!address) return alert('Bitte gib eine Serveradresse ein.');

    // Blockliste prüfen
    if (blockedServers.includes(address)) {
      alert("Diese Serveradresse ist blockiert und kann nicht hinzugefügt werden.");
      return;
    }

    const remember = rememberCheckbox.checked;

    if(editingIndex === null) {
      if(allServers.some(s => s.address === address)) {
        alert('Server ist bereits in der Liste.');
        return;
      }
      const newServer = { address };
      customServers.push(newServer);
      saveCustomServers(customServers, remember);
    } else {
      const oldServer = allServers[editingIndex];
      if(oldServer.isDefault) {
        alert('Voreingestellte Server können nicht bearbeitet werden.');
        closeModal();
        return;
      }
      if(allServers.some((s, i) => i !== editingIndex && s.address === address)) {
        alert('Serveradresse existiert bereits in der Liste.');
        return;
      }
      const csIndex = customServers.findIndex(s => s.address === oldServer.address);
      if(csIndex !== -1) {
        customServers[csIndex].address = address;
        saveCustomServers(customServers, remember);
      }
    }

    customServers = loadCustomServers();
    allServers = [...defaultServers, ...customServers];
    renderServerList();
    closeModal();
  });

  // Löschen Button
  deleteBtn.addEventListener('click', () => {
    if(editingIndex === null) return;
    const server = allServers[editingIndex];
    if(server.isDefault) {
      alert('Voreingestellte Server können nicht gelöscht werden.');
      return;
    }
    if(!confirm(`Willst du den Server "${server.address}" wirklich löschen?`)) return;

    customServers = customServers.filter(s => s.address !== server.address);
    saveCustomServers(customServers, true);
    allServers = [...defaultServers, ...customServers];
    renderServerList();
    closeModal();
  });

  addServerBtn.addEventListener('click', () => openModal('add'));


  setInterval()
  renderServerList();
</script>

</body>
</html>
