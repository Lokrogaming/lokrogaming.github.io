<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Mapping: Jeder User hat eigene Targets
    const redirects = {
      lokrogamer: {
        github: "https://github.com/Lokrogaming",
        twitch: "https://www.twitch.tv/lokrogamer",
        discord: "https://dcs.lol/lokrogaming",
        whatsapp: "https://whatsapp.com/channel/0029VbAJwgOI7BeHXOWkiR1c",
        tiktok: "https://tiktok.com/@lokrogaming",
        steam: "https://steamcommunity.com/id/lokrogaming/"
      },
      // Beispiel für einen weiteren User:
      reufnr: {
        youtube: "https://youtube.com/@reufnr",
        twitch: "https://twitch.tv/reufnr",
        discord: "https://dcs.lol/lokrogaming",
        whatsapp: "https://whatsapp.com/channel/0029VbApeNf3rZZWjxRkNw1L"
      },
      eministar: {
        spotify: "https://open.spotify.com/intl-de/artist/3CMXtG8FvXd7YIbDvWsrPA?si=PGtuYceUTWSDVY9pgXBL1w",
        linktree: "https://linktr.ee/eministarvr",
        github: "https://github.com/EministarVR",
        twitch: "https://twitch.tv/eministarvr",
        bmc: "https://buymeacoffee.com/eministar",
        discord: "https://dcs.lol/edg",
        whatsapp: "https://whatsapp.com/channel/0029VaNDIpxG8l5HAWo2tT1X"
      },
      igris: {
        twitch: "https://www.twitch.tv/ifritsShadow",
        discord: "https://dcs.lol/igrisshadow",
        youtube: "https://youtube.com/@igrisschadow?si=7J9i08w5ggWAgcQQ"
      },
      dcs: {
        deutschland: "https://dcs.lol/deutschland",
        lokrogames: "https://dcs.lol/lokrogames"
      }
    };

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const targetedUser = params.get("targeteduser");
      const target = params.get("target");

      if (targetedUser && target && redirects[targetedUser] && redirects[targetedUser][target]) {
        // Umleitung durchführen
        window.location.href = redirects[targetedUser][target];
      } else {
        // Fallback: zurück zur Startseite
        document.body.innerHTML = `
          <h1>Ungültiger Redirect-Link</h1>
          <p>Bitte überprüfe <code>?targeteduser</code> und <code>?target</code>.</p>
          <p><a href="/">Zurück zur Startseite</a></p>`;
      }
    };
  </script>
</head>
<body>
  <p>Weiterleitung läuft...</p>
</body>
</html>
