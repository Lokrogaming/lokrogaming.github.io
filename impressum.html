<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum — LOKRO</title>
<meta name="description" content="Weiterleitung zum LOKRO Impressum (Deutsch).">
<link rel="canonical" href="https://lokro.dev/de/impressum.html">
<meta http-equiv="refresh" content="0; url=/de/impressum.html">
<link rel="icon" type="image/png" href="/assets/lokro-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="antialiased">
<main class="min-h-screen flex items-center justify-center px-6">
<div class="card chamfer p-8 max-w-md w-full text-center">
<div class="eyebrow mb-4">LOKRO · WEITERLEITUNG</div>
<h1 class="font-display text-2xl font-semibold">Impressum</h1>
<p class="muted text-sm mt-3 leading-relaxed">Diese Seite ist nach <span class="font-mono">/de/impressum.html</span> umgezogen. Du wirst automatisch weitergeleitet.</p>
<div class="mt-6 flex flex-col gap-2">
<a href="/de/impressum.html" class="btn-primary chamfer-sm px-5 py-3 text-sm">Weiter zu /de/impressum.html</a>
<a href="/en/impressum.html" class="btn-ghost chamfer-sm px-5 py-2.5 text-sm">English version instead →</a>
</div>
</div>
</main>
<script>
(function () {
  var h = window.location.hash || '';
  var q = window.location.search || '';

  try {
    var s = localStorage.getItem('lokro-language');

    if (
      s &&
      ['de', 'en', 'fr', 'it', 'es', 'tr', 'la'].indexOf(s) !== -1 &&
      s !== 'de'
    ) {
      window.location.replace('/' + s + '/impressum.html' + q + h);
      return;
    }
  } catch (e) {}

  window.location.replace('/de/impressum.html' + q + h);
})();
</script>
</body>
</html>
