  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
    html {
      overflow: hidden;
      
    }
body {
  
    background: #000;
    min-height: 100vh;
    max-width: 100vw;
    overflow:hidden;
}
   #credits {
     bottom: 10px;
     right: 50%;
     position: fixed;
     z-index: 99999;
     color: white;
     font-family: "Nunito";
   }
      #bg-blur {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(30px);
    background: rgba(0,0,0,0.2);
    z-index: 2;
    pointer-events: none;
}
    
.wrapper {
    position: fixed;
    min-height: 100vh;
  
    overflow: hidden;
    animation: animate 10s linear infinite;
}
@keyframes animate {
    0% {
        filter: hue-rotate(0deg);
    }
    100% {
        filter: hue-rotate(360deg);
    }
}
.hex {
    display: inline-flex;
    margin-top: -32px;
    margin-left: -50px;
    overflow: hidden;
}
.hex:nth-child(even) {
    margin-left: 1px;
}
.hexagon {
    position: relative;
    background-color: #111;
    height: 110px;
    width: 100px;
    margin: 1px;
    transition: 2s;
    clip-path: polygon(50% 0%, 
    100% 25%, 100% 75%, 50% 100%,
     0% 75%, 0% 25%);
}
.hexagon::before {
    position: absolute;
    content: '';
    height: 100%;
    width: 50%;
    background: rgba(255, 255, 255, 0.04);
}
.hexagon:hover {
    transition: 0s;
    background: lime;
}
    .content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      position: fixed;
      width: 100vw;
      height: auto;
      color: white;
      font-family: "Nunito";
      pointer-events: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      
      width: 300px;
      height: 400px;
      border: solid 1px white;
      border-radius: 14px;
      
    }
    .card .card-header {
      border-bottom: white solid 1px;
      border-width: 100%;
    }
    .card .card-content {
      margin-top: 5px;
    }
    a {
      text-decoration: none;
      color: white;
    }
  </style>
</head>
