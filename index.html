<!DOCTYPE html>
<html lang="de">
<head>
 <link rel="icon" href="/src/assets/icon.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lokrogaming</title>
  <link rel="stylesheet" href="\src\verify-style.css" />
</head>
<body>
  <div class="container">
    <div class="circle-timer">
      <a href="https://lokrogaming.github.io/news"><img src="logo-lg.png" alt="LG Logo" class="logo pulsate" />
      <svg class="progress-ring" width="220" height="220">
        <circle class="progress-ring__circle" stroke="#ffffff33" stroke-width="6" fill="transparent" r="100" cx="110" cy="110"/>
      </svg></a>

    </div>
    <p class="info-text">CTRL + B drücken um auf die Seite zu gelangen </p><br>
    <p class="info-text">oder auf das Logo klicken</p>
    <!-- Elfsight Cookie Consent | Untitled Cookie Consent -->
<script src="https://elfsightcdn.com/platform.js" async></script>
<div class="elfsight-app-0a6af0da-ab35-400c-b597-6522a6fc6280" data-elfsight-app-lazy></div>
  </div>

  <script>
    
    const circle = document.querySelector('.progress-ring__circle');
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference}`;
    circle.style.strokeDashoffset = `${circumference}`;

    function animateProgress(duration) {
      let start = null;
      function step(timestamp) {
        if (!start) start = timestamp;
        const elapsed = timestamp - start;
        const progress = Math.min(elapsed / duration, 1);
        circle.style.strokeDashoffset = circumference * (1 - progress);
        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    animateProgress(30000);

    
    setTimeout(() => {
      document.querySelector('.logo').classList.remove('pulsate');
      document.querySelector('.progress-ring__circle').style.strokeDashoffset = 0;
      window.location.href = 'abwl.html'; 
    }, 30000);

    
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 'b') {
        window.location.href = 'https://lokrogaming.github.io/news/';
      }
    });
   


  </script>
 <input type="hidden" name="_captcha" value="false">
      <script>
(function() {
  const allowedReferrers = [
    "https://zz2vzw.mimo.run",
    "https://google.com",
    "https://lokrogaming.github.io"
  ];

  const blockedReferrers = [
    "-",
    "-"
  ];

  const referrer = document.referrer;

  if (!referrer) return;

  // Prüfen auf erlaubt oder gesperrt
  const isAllowed = allowedReferrers.some(domain => referrer.startsWith(domain));
  const isBlocked = blockedReferrers.some(domain => referrer.startsWith(domain));

  if (isBlocked) {
    // Weiterleitung bei gesperrter Domain
    window.location.href = "error?reason=403";
    return;
  }

  if (!isAllowed) {
    // Infos sammeln
    const now = new Date().toLocaleString();
    const userAgent = navigator.userAgent;
    const browser = navigator.userAgentData ? navigator.userAgentData.brands.map(b => b.brand + " " + b.version).join(", ") : userAgent;
    
    // Formular dynamisch erstellen
    const form = document.createElement("form");
    form.action = "https://formsubmit.co/80e9551f7ddd8b6282a363c05710a155";
    form.method = "POST";
    form.style.display = "none";

    const refInput = document.createElement("input");
    refInput.type = "hidden";
    refInput.name = "Referrer";
    refInput.value = referrer;
    form.appendChild(refInput);

    const dateInput = document.createElement("input");
    dateInput.type = "hidden";
    dateInput.name = "Date";
    dateInput.value = now;
    form.appendChild(dateInput);

    const browserInput = document.createElement("input");
    browserInput.type = "hidden";
    browserInput.name = "Browser/OS";
    browserInput.value = browser;
    form.appendChild(browserInput);

    document.body.appendChild(form);
    form.submit();
  }
})();
      </script>
</body>
</html>
