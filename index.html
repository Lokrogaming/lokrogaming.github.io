<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lokrogamer | Stream Starting Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #9146FF; /* Twitch Purple */
            --accent: #00FFCC;
            --bg-dark: #0e0e10;
            --card-bg: rgba(24, 24, 27, 0.9);
            --text: #efeff1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background Gradient */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #0e0e10, #1a1a2e, #2d1b4e, #0e0e10);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--primary) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: moveParticles 20s linear infinite;
        }

        @keyframes moveParticles {
            from { transform: translateY(0); }
            to { transform: translateY(-50px); }
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 1;
            padding: 3rem 2rem;
            backdrop-filter: blur(12px);
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-width: 800px;
            width: 95%;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fixed Clock Container */
        .clock-wrapper {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .clock-icon {
            display: block;
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(145, 70, 255, 0.5));
        }
        
        #hand {
            transform-origin: 12px 12px; /* Center of the 24x24 viewBox */
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 0.6rem 1.8rem;
            background: rgba(145, 70, 255, 0.15);
            border: 1px solid var(--primary);
            border-radius: 100px;
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(145, 70, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(145, 70, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(145, 70, 255, 0); }
        }

        .countdown {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            margin: 2.5rem 0;
            width: 100%;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.04);
            flex: 1;
            min-width: 120px;
            max-width: 140px;
            padding: 1.5rem 0.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 4px solid var(--primary);
            transition: all 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .time-value {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--text);
            opacity: 0.5;
        }

        .twitch-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1.2rem 3rem;
            border-radius: 16px;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 1rem;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px -10px rgba(145, 70, 255, 0.6);
        }

        .twitch-btn:hover {
            background-color: #a970ff;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 35px -10px rgba(145, 70, 255, 0.8);
        }

        .twitch-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        @media (max-width: 650px) {
            .countdown { gap: 0.75rem; }
            .time-box { min-width: 80px; padding: 1rem 0.2rem; }
            .time-value { font-size: 1.75rem; }
            .container { padding: 2rem 1rem; }
            .clock-icon { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div class="particles"></div>

    <main class="container">
        <!-- Centered SVG Clock -->
        <div class="clock-wrapper">
            <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="#9146FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14" id="hand"></polyline>
            </svg>
        </div>

        <div class="status-badge">STREAMING SOON</div>
        <h1>lokrogamer</h1>
        
        <div class="countdown" id="timer">
            <div class="time-box">
                <span class="time-value" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">Sec</span>
            </div>
        </div>

        <a href="https://twitch.tv/lokrogamer" class="twitch-btn" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
            Follow on Twitch
        </a>
    </main>

    <script>
        // Target Date: March 1, 2026
        const targetDate = new Date("March 1, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("timer").innerHTML = "<h3 style='color: var(--accent); font-size: 2rem; width: 100%'>STREAM IS LIVE!</h3>";
            }
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
