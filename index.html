<script>
(function() {
  const allowedReferrers = [
    "https://zz2vze.mimo.run",
    "https://google.com",
    "https://lokrogaming.github.io",
    "https://www.google.com",
   "android-app://com.google.android.googlequicksearchbox"
   
  ];

  const blockedReferrers = [
    "https://clr785.mimo.run",
    "www.facebook.com",
    "facebook.com"
  ];

  const referrer = document.referrer;

  if (!referrer) return;

  // Prüfen auf erlaubt oder gesperrt
  const isAllowed = allowedReferrers.some(domain => referrer.startsWith(domain));
  const isBlocked = blockedReferrers.some(domain => referrer.startsWith(domain));

  if (isBlocked) {
    // Weiterleitung bei gesperrter Domain
    window.location.href = "error?reason=403";
    return;
  }

  if (!isAllowed) {
    // Infos sammeln
    const now = new Date().toLocaleString();
    const userAgent = navigator.userAgent;
    const browser = navigator.userAgentData ? navigator.userAgentData.brands.map(b => b.brand + " " + b.version).join(", ") : userAgent;
    
    // Formular dynamisch erstellen
    const form = document.createElement("form");
    form.action = "https://formsubmit.co/80e9551f7ddd8b6282a363c05710a155";
    form.method = "POST";
    form.style.display = "none";

    const refInput = document.createElement("input");
    refInput.type = "hidden";
    refInput.name = "Referrer";
    refInput.value = referrer;
    form.appendChild(refInput);

    const dateInput = document.createElement("input");
    dateInput.type = "hidden";
    dateInput.name = "Date";
    dateInput.value = now;
    form.appendChild(dateInput);

    const browserInput = document.createElement("input");
    browserInput.type = "hidden";
    browserInput.name = "Browser/OS";
    browserInput.value = browser;
    form.appendChild(browserInput);

    // Captcha deaktivieren
    const captchaInput = document.createElement("input");
    captchaInput.type = "hidden";
    captchaInput.name = "_captcha";
    captchaInput.value = "false";
    form.appendChild(captchaInput);


   const nextInput = document.createElement("input");
    nextInput.type = "hidden";
    nextInput.name = "_next";
    nextInput.value = "https://lokrogaming.github.io/news";
    form.appendChild(nextInput);



   const templateInput = document.createElement("input");
    templateInput.type = "hidden";
    templateInput.name = "_template";
    templateInput.value = "box";
    form.appendChild(templateInput);

    document.body.appendChild(form);
    form.submit();
  }
})();
</script>
