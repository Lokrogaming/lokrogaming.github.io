    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(260deg, black, cyan) repeat;
            align-items:center;
            display:flex;
            flex-direction:column;
            font-family: "M PLUS Rounded 1c", sans-serif;
            gap:20px;
        }
       .pair {
        display: flex;
        flex-direction: row;
        gap:12px;
       }
.card {
  width: 300px;
  height: 400px auto;
  margin: 0 auto;
  background-color: #24233b;
  border-radius: 8px;
  z-index: 1;
  box-shadow: 0px 10px 10px rgb(73, 70, 92);
  transition: 0.5s;
}

.card:hover {
  transform: translateY(-7px);
  box-shadow: 0px 10px 10px black;
}

.top {
  display: flex;
  align-items: center;
  padding-left: 10px;
}

.circle {
  padding: 0 4px;
}

.circle2 {
  display: inline-block;
  align-items: center;
  width: 10px;
  height: 10px;
  padding: 1px;
  border-radius: 5px;
}

.red {
  background-color: #ff605c;
}

.yellow {
  background-color: #ffbd44;
}

.green {
  background-color: #00ca4e;
}

.header {
  margin: 5px;
  margin-top: 5px;
  border-radius: 5px;
}

#title2 {
  color: white;
  padding-left: 50px;
  font-size: 15px;
}

.code-container {
  text-align: center;
}
#code {
  width: 270px;
  height: 350px;
  resize: none;
  background-color: rgb(73, 70, 92);
  border-radius: 5px;
  border: none;
  color: white;
  padding: 10px;
}
#code:focus {
  outline: none !important;
}
.btn1 {
    border: none;
    border-radius: 13px;
    color: black;
    background-color: rgb(95, 95, 95);
    width: 120px;
    height: 50px;
    transition: ease-in-out 0.15s
}
.btn1:hover {
    border: none;
    border-radius: 13px;
    color: black;
    background-color: rgb(180, 31, 31);
    width: 120px;
    height: 75px;
}

.card1 {
  width: 190px;

  border-radius: 1rem;
  background-color: #4158D0;
  background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);

}
