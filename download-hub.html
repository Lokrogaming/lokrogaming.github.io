<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="sign-in.js" defer></script>
</head>
<body>
    <div class="topnav">
        <a href="index.html">Home</a>
        <a href="game-library.html">Games</a>
        <a href="projekte.html">Projekte</a>
        <a class="active" href="#">Downloader</a>
        <a class="about" href="about.html">About</a>
    </div>
    <div class="login-container">
        <h1>Anmelden</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Benutzername" required>
            <input type="password" id="password" placeholder="Passwort" required>
            <div class="captcha-container">
                <label id="captchaLabel"></label>
                <input type="text" id="captchaInput" placeholder="Captcha" required>
            </div>
            <button class="button" id="submit" type="submit">Anmelden</button>
        </form>
        <p id="message"></p>
    </div>
    <script>fetch('/src/JSON/Projects/settings.json')
  .then(response => {
    if (!response.ok) throw new Error("Datei konnte nicht geladen werden.");
    return response.json();
  })
  .then(data => {
    if (data.quarantine === true) {
      window.location.href = 'nochimumbau.html';
    }
  })
  .catch(error => {
    console.error('Fehler beim Laden der JSON-Datei:', error);
  });</script>
</body>
</html>
