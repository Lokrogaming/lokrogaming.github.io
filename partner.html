<script>
const dropupProjectMenu = document.getElementById("projekteMenu");
const dropupProjectBtn = document.getElementById("projekteBtn");
dropupProjectBtn.addEventListener("click", function(e) {
  e.preventDefault();
  dropupProjectMenu.classList.toggle("show");
  dropupProjectBtn.classList.toggle("active");
});


window.addEventListener("click", function(e) {
  if (!e.target.closest(".icon-content")) {
    dropupProjectMenu.classList.remove("show");
    dropupProjectBtn.classList.remove("active");
  }
});
</script>
