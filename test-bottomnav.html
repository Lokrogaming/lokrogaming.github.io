<script>
// Toggle öffnen/schließen
document.getElementById("projekteBtn").addEventListener("click", function(e) {
  e.preventDefault();
  document.getElementById("projekteMenu").classList.toggle("show");
});

// Schließt Dropup wenn man woanders klickt
window.addEventListener("click", function(e) {
  if (!e.target.closest(".icon-content")) {
    document.getElementById("projekteMenu").classList.remove("show");
  }
});
</script>
    <script>
      document.getElementById("searchinput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
          search();
        }
      });
      function search() {
        const searchinput = document.getElementById("searchinput").value;
        if (searchinput !== "") {
          const request = encodeURIComponent(searchinput);
          window.location.href = `s.html?request=${request}`;
        } else {
          alert("Search can't be empty!");
        }
      }
    </script>
