<html><head><link rel="stylesheet" href="/src/style.css"><style>

ul {
  list-style: none;
}
body {
  background: black;
  margin: 0;
  font-family: "Varela Round";
  font-style: normal;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}



</style>
</head>
<body>
<!--- QUARANTINE  -->
<script src="JS\modules/quarantineMode.js" defer></script>
<!------>
<ul class="bottomnav">
  <!-- Projekte Dropup mit Toggle -->
  <li class="icon-content">
    <a href="#" aria-label="Projekte" class="link" id="projekteBtn">
      <svg width="800px" height="800px" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 1H6L9 4H16V14H0V1Z"/>
      </svg>
    </a>
    <div class="tooltip">Projekte</div>

    <!-- Dropup Inhalt -->
    <div class="dropup-content" id="projekteMenu">
      <a href="projekte.html">Alle Projekte</a>
      <a href="projekt1.html">Projekt 1</a>
      <a href="projekt2.html">Projekt 2</a>
    </div>
  </li>
</ul>

<script>
// Toggle öffnen/schließen
document.getElementById("projekteBtn").addEventListener("click", function(e) {
  e.preventDefault();
  document.getElementById("projekteMenu").classList.toggle("show");
  document.getElementById("projekteBtn").classList.toggle("active");
});

// Schließt Dropup wenn man woanders klickt
window.addEventListener("click", function(e) {
  if (!e.target.closest(".icon-content")) {
    document.getElementById("projekteMenu").classList.remove("show");
    document.getElementById("projekteBtn").classList.remove("active");
  }
});
</script>
</body>
</html>
