name: Sync Changelog

# Pulls published entries from the AutoChangelog REST API into
# changelog.json (+ per-language copies) so the static
# /{lang}/changelog.html pages stay up to date without a backend.
#
# Setup (one time, repo owner only):
#   1. AutoChangelog Pro/Team: request API access (Settings > API Access),
#      create a key once approved.
#   2. GitHub repo: Settings > Secrets and variables > Actions >
#      New repository secret named AUTOCHANGELOG_API_KEY with that key.
#      Optional repository variables: AUTOCHANGELOG_OWNER / AUTOCHANGELOG_REPO
#      (defaults track Lokrogaming/lokrogaming.github.io).
# The key is only used inside this workflow and never lands in the repo.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch entries from AutoChangelog
        env:
          AUTOCHANGELOG_API_KEY: ${{ secrets.AUTOCHANGELOG_API_KEY }}
        run: python .github/workflows/sync_changelog.py
      - name: Commit if changed
        run: |
          git config user.name "lokro-bot"
          git config user.email "lokro-bot@users.noreply.github.com"
          git add changelog*.json
          # [skip ci] is intentional: it stops this push from re-triggering
          # the bump webhook workflow (which would create junk entries
          # about the sync commit itself).
          git diff --cached --quiet || git commit -m "chore: sync changelog entries [skip ci]"
          git push
