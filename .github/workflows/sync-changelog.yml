name: Sync Changelog

# Pulls published entries from AutoChangelog into
# changelog.json (+ per-language copies) so the static
# /{lang}/changelog.html pages stay up to date without a backend.
#
# Default source is the public RSS feed (no key needed, Free plan OK).
# Optional repository variables:
#   CHANGELOG_SOURCE=rss|api (default rss)
#   CHANGELOG_RSS_URL (default: LOKRO feed)
#   For api mode: secret AUTOCHANGELOG_API_KEY (+ optional
#   AUTOCHANGELOG_OWNER / AUTOCHANGELOG_REPO).
# Keys/secrets are only used inside this workflow and never land in the repo.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch entries from AutoChangelog
        env:
          AUTOCHANGELOG_API_KEY: ${{ secrets.AUTOCHANGELOG_API_KEY }}
          CHANGELOG_SOURCE: ${{ vars.CHANGELOG_SOURCE }}
          CHANGELOG_RSS_URL: ${{ vars.CHANGELOG_RSS_URL }}
        run: python .github/workflows/sync_changelog.py
      - name: Commit if changed
        run: |
          git config user.name "lokro-bot"
          git config user.email "lokro-bot@users.noreply.github.com"
          git add changelog*.json
          # [skip ci] is intentional: it stops this push from re-triggering
          # the bump webhook workflow (which would create junk entries
          # about the sync commit itself).
          git diff --cached --quiet || git commit -m "chore: sync changelog entries [skip ci]"
          git push
