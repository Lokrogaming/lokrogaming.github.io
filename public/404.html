<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOKRO — Weiterleitung</title>
</head>
<body>
<script>
(function () {
  var p = window.location.pathname;
  // Statische Assets und API-Aufrufe nicht umleiten
  if (/\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|json|webmanifest)$/i.test(p)) return;
  if (p === '/' || p === '/index.html') return;
  // Einzelseiten-App booten und den ursprünglichen Pfad im Hash mitgeben
  window.location.replace('/index.html#' + encodeURIComponent(p));
})();
</script>
</body>
</html>
