<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOKRO — Weiterleitung</title>
</head>
<body>
<script>
(function () {
  var p = window.location.pathname;
  // Statische Assets und API-Aufrufe nicht umleiten
  if (p === '/' || p === '/index.html') return;
  if (/\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|json|webmanifest)$/i.test(p)) return;
  // Pfad für die React-App zwischenspeichern (ohne Neuladen der Seite durch hash-Manipulation)
  try { localStorage.setItem('__spa_path', p); } catch {}
  window.location.replace('/index.html');
})();
</script>
</body>
</html>
