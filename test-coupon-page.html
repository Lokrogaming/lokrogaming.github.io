<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Website</title>
  <link rel="stylesheet" href="test-styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@300&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

<!------>
</head>
</head>
<body>
  <nav id="navigation">Navigation</nav>
  <main>
    <h1>Willkommen!</h1>
    <p>Dies ist deine personalisierte Seite.</p>
    <button onclick="openSettings()">⚙️ Einstellungen</button>
  </main>

  <div id="settings" style="display: none;">
    <h2>⚙️ Einstellungen</h2>
    <label>Hintergrundfarbe:
      <input type="color" id="bgColor">
    </label><br>
    <label>Schriftfarbe:
      <input type="color" id="textColor">
    </label><br>
    <label>Schriftart:
      <select id="fontSelect">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Courier New">Courier New</option>
      </select>
    </label><br>
    <label>Navigation:
      <select id="navPosition">
        <option value="top">Oben</option>
        <option value="side">Links</option>
      </select>
    </label><br><br>
    <button onclick="saveSettings()">✅ Speichern</button>
    <button onclick="closeSettings()">❌ Schließen</button>
  </div>

  <script src="test-script.js"></script>
</body>
</html>
