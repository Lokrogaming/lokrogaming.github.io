<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NCS Radio</title>
    <link rel="stylesheet" href="src/radioStyle.css">
</head>
<body>

<div class="radio">
    <h1>📻 NCS Radio</h1>
    <p id="status">Bereit</p>

    <div class="controls">
        <button id="play">▶</button>
        <button id="pause">⏸</button>
        <button id="stop">⏹</button>
        <button id="skip">⏭</button>
    </div>

    <div class="volume">
        🔊
        <input type="range" id="volume" min="0" max="100" value="70">
    </div>
</div>

<script src="radioScript.js"></script>
</body>
</html>
