    <title>Sprinkle</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; color: #333; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button.btn { background: #007bff; color: white; border: none; padding: 10px 15px; margin-top: 15px; border-radius: 14px; cursor: pointer; width: 100%; font-size: 16px; }
        button.btn:hover { background: #0056b3; }
        button.copyBtn { background: lightgrey; color: black; border-radius: 10px; border: none; padding: 5px; margin-top: 15px; cursor: pointer; width: 75px; height: 75px;}
        button.copyBtn:hover { background: grey; }
        .output { background: #e9ecef; padding: 10px; border-radius: 4px; word-break: break-all; margin-top: 10px; white-space: pre-wrap; font-family: monospace; }
        .error { color: red; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Sprinkle</h2>

    <!-- ENCODER BOX -->
    <div class="box">
        <h3>Encoder (Verschlüsseln)</h3>
        <label>Klartext:</label>
        <textarea id="encText" placeholder="Hier Nachricht eingeben...">Hier Nachricht eingeben...</textarea>
        
        <button class="btn" id="btnEncrypt">Verschlüsseln</button>
        
        <label>Ergebnis:</label>

        <div id="encOutput" class="output">-</div>
    </div>

    <!-- DECODER BOX -->
    <div class="box">
        <h3>Decoder (Entschlüsseln)</h3>
        <label>Verschlüsselter String:</label>
        <textarea id="decInput" rows="3" placeholder="Hier verschlüsselten Text einfügen..."></textarea>
        
        <button class="btn" id="btnDecrypt">Entschlüsseln</button>

        <div id="decOutput" class="output">-</div>
    </div>
<script>
function copy(target) {
if (target === "decrypt") {
    const text = decOutText.innerText;
    navigator.clipboard.writeText(text);
    alert("Copied to Clipboard!")
} else { 
    const text = encOutput.innerText;
    navigator.clipboard.writeText(text);
    alert("Copied to clipboard!")
    
}
}
</script>
    <script type="module">
        import { encoder, decoder } from './sprinkle.js';

        // Event-Listener für Verschlüsselung
        document.getElementById('btnEncrypt').addEventListener('click', async () => {
            const text = document.getElementById('encText').value;
            const outputDiv = document.getElementById('encOutput');

            try {
                const result = await encoder(text);
                outputDiv.textContent = result;
                outputDiv.classList.remove('error');
            } catch (err) {
                outputDiv.textContent = "Fehler: " + err.message;
                outputDiv.classList.add('error');
            }
        });

        // Event-Listener für Entschlüsselung
        document.getElementById('btnDecrypt').addEventListener('click', async () => {
            const input = document.getElementById('decInput').value.trim();
            const outputDiv = document.getElementById('decOutput');

            try {
                if(!input) throw new Error("Bitte verschlüsselten Text eingeben.");
                
                const result = await decoder(input);
                outputDiv.innerHTML = `
                    <p id="decOutText">${result.text}</p>
                `;
                outputDiv.classList.remove('error');
            } catch (err) {
                outputDiv.textContent = "Fehler beim Entschlüsseln. Das Format ist ungültig oder der String wurde manipuliert.";
                outputDiv.classList.add('error');
            }
        });
    </script>
</body>
</html>
