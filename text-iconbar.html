  <style>
       
ul {
  list-style: none;
}

.bottomnav {
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bolder; /* Made bolder */
  background-color: #333; /* Black background */
  border-radius: 30px; /* Added border-radius to make the container rounded */
  padding: 20px; /* Added padding for better appearance */
  height: 70px;
  width: 100% auto;
  margin-bottom: 1px;
}

.bottomnav .icon-content {
  margin: 0 10px;
  position: relative;
  font-weight: bolder; /* Made bolder */
}
/* Active State für Social Icons */



.bottomnav .icon-content .tooltip {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #fff; /* White background */
  color: #000; /* Black text */
  padding: 6px 10px;
  border-radius: 5px;
  opacity: 0;
  visibility: hidden;
  font-size: 14px;
  transition: all 0.3s ease;
  font-weight: bolder; /* Made bolder */
}

.bottomnav .icon-content:hover .tooltip {
  opacity: 1;
  visibility: visible;
  top: -50px;
}

.bottomnav .icon-content .link {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  color: #fff; /* White icons */
  background-color: #000; /* Black background */
  transition: all 0.3s ease-in-out;
  font-weight: bolder; /* Made bolder */
}

.bottomnav .icon-content .link:hover {
  box-shadow: 3px 2px 45px 0px rgb(0 0 0 / 12%);
}

.bottomnav .icon-content .link svg {
  width: 60%;
  height: auto;
  fill: currentColor; /* nutzt die Textfarbe der .link */
}

.bottomnav .icon-content .link.active {
  background-color: #fff;
  color: #000; /* text- und iconfarbe */
  transform: scale(1.2);
  transition: all 0.3s ease-in-out;
}

.bottomnav .link:hover {
  color: #333;
}


  </style>
